exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

monitor = , preferred, auto, 1.25

#INFO: MY PROGRAMS

$browser = brave
$lock = hyprlock
$terminal = kitty
$zen= zen-browser
$fileManager = pcmanfm
$notes = obsidian --ozone-platform=wayland
$wallpaper = waypaper
$code = cursor --ozone-platform=wayland
$spotify = spotify --ozone-platform=wayland
$screenshot = ~/.config/hypr/scripts/screenshot.sh
$selection_screenshot = ~/.config/hypr/scripts/slurp.sh
$random_wall = waypaper --random --folder ~/Pictures/walls --backend awww

# █▀▀ ▀▄▀ █▀▀ █▀▀
# ██▄ █░█ ██▄ █▄▄


exec-once = waybar
exec-once = awww-daemon && sleep 0.1 && awww restore
exec-once = swaync
exec-once = clipse -listen
exec-once = hypridle
exec-once = udiskie -2
exec-once = hyprsunset
exec-once = /usr/lib/soteria-polkit/soteria
exec-once = hyprctl setcursor Bibata-Modern-Ice 22
exec-once = ~/.config/hypr/scripts/power_monitor.sh

source = ~/.config/hypr/mocha.conf


#INFO: ENVIRONMENT VARIABLES

env = GDK_SCALE,1
env = GDK_DPI_SCALE,1
env = GDK_BACKEND,wayland

env = XCURSOR_SIZE,22
env = HYPRCURSOR_SIZE,22
env = MOZ_ENABLE_WAYLAND,1

env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1.25
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

#INFO: LOOK AND FEEL

# █▀▀ █▀▀ █▄░█ █▀▀ █▀█ ▄▀█ █░░
# █▄█ ██▄ █░▀█ ██▄ █▀▄ █▀█ █▄▄

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb($mauve)
    col.inactive_border = rgb($transparent)
    resize_on_border = false
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 5
    active_opacity = 0.80
    inactive_opacity = 0.70

    blur {
        enabled = true
        size = 8
        passes = 2

        vibrancy = 0.1696
    }
}

# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█

animations {
    enabled = 0
    workspace_wraparound = 1
    bezier = default, 0.05, 0.9, 0.1, 1.05
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.08
    bezier = liner, 1, 1, 1, 1
    bezier = bounce, 0.4, 0.9, 0.6, 1.0
    bezier = snappyReturn, 0.4, 0.9, 0.6, 1.0

    bezier = slideInFromRight, 0.5, 0.0, 0.5, 1.0
    animation = windows, 1, 5,  snappyReturn, slidevert
    animation = windowsIn, 1, 5, snappyReturn, slidevert right

    animation = windowsOut, 1, 5, snappyReturn, slide
    animation = windowsMove, 1, 6, bounce, slide
    animation = layersOut, 1, 5, bounce, slidevert right
    animation = fadeIn, 1, 10, default
    animation = fadeOut, 1, 10, default
    animation = fadeSwitch, 1, 10, default
    animation = fadeShadow, 1, 10, default
    animation = fadeDim, 1, 10, default
    animation = fadeLayers, 1, 10, default
    animation = workspaces, 1, 7, overshot, slidevert
    animation = border, 1, 1, liner
    animation = layers, 1, 4, bounce, slidevert right
    animation = borderangle, 1, 30, liner, loop
}

# █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}


# █▀▄▀█ █ █▀ █▀▀
# █░▀░█ █ ▄█ █▄▄

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    font_family = "Poppins"
    vfr = true
    vrr = 1
}

# █ █▄░█ █▀█ █░█ ▀█▀
# █ █░▀█ █▀▀ █▄█ ░█░

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 50
    repeat_delay = 300

    follow_mouse = 1

    sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.
    accel_profile = adaptive

touchpad {
        natural_scroll = true
        disable_while_typing = true
        drag_lock = 1
    }
}

gesture = 3, horizontal, workspace

#INFO: xwayland application

xwayland {
  force_zero_scaling = true
}

# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀

$mainMod = SUPER # Sets "Windows" key as main modifier
bind = $mainMod, Q, killactive,

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀▄▀█ ▄▀█ █▄░█ ▄▀█ █▀▀ █▀▄▀█ █▀▀ █▄░█ ▀█▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █░▀░█ █▀█ █░▀█ █▀█ █▄█ █░▀░█ ██▄ █░▀█ ░█░

bind = $mainMod, Z, exec, $zen
bind = $mainMod, C, exec, $code
bind = $mainMod, B, exec, $browser
bind = $mainMod, W, exec, $wallpaper
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, O, exec, $notes
bind = $mainMod, R, exec, ~/.config/rofi/launchers/type-3/launcher.sh
bind = ALT, M, exec, $spotify

bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod, S, exec, $screenshot
bind = SUPER SHIFT, S, exec, $selection_screenshot
bind =  ,Print, exec, $selection_screenshot
bind = $mainMod, P, exec, wezterm -e btop
bind = $mainMod, Y, exec, wezterm -e yazi
bind = $mainMod SHIFT, W, exec, $random_wall
bind = SUPER SHIFT, Space, togglefloating

bind = ALT, L, exec, $lock
bind = $mainMod SHIFT, M, exec, wlogout -b 5
bind = SUPER, V, exec,  kitty --class clipse -e 'clipse'
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

# █▀▀ █▀█ █▀▀ █░█ █▀
# █▀░ █▄█ █▄▄ █▄█ ▄█
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# █▀█ █▀▀ █▀ █ ▀█ █▀▀
# █▀▄ ██▄ ▄█ █ █▄ ██▄
bind = SUPER CTRL, h, resizeactive, -20 0
bind = SUPER CTRL, l, resizeactive, 20 0
bind = SUPER CTRL, k, resizeactive, 0 -20
bind = SUPER CTRL, j, resizeactive, 0 20

# █▀ █░█░█ █ ▀█▀ █▀▀ █░█
# ▄█ ▀▄▀▄▀ █ ░█░ █▄▄ █▀█
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# █▀▄▀█ █░█ █░░ ▀█▀ █ █▀▄▀█ █▀▀ █▀▄ █ ▄▀█
# █░▀░█ █▄█ █▄▄ ░█░ █ █░▀░█ ██▄ █▄▀ █ █▀█
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , xf86monbrightnessup, exec, brightnessctl set 5%+
binde = , xf86monbrightnessdown, exec, brightnessctl set 5%-

binds {
    drag_threshold = 10  # Fire a drag event only after dragging for more than 10px
}
bindm = ALT, mouse:272, movewindow      # ALT + LMB: Move a window by dragging more than 10px.
bindc = ALT, mouse:272, togglefloating  # ALT + LMB: Floats a window by clicking
binddm = ALT_CTRL, mouse:272, resizewindow

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀█ █░█ █░░ █▀▀ █▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

windowrule = float true, center true, size 900 500,match:class blueman-manager
windowrule = float true, center true, size 900 500,match:title ^(Network Connections)$
windowrule = float true, center true, size 900 600,match:title ^(Volume Control)$
windowrule = float true, center true, size 800 600,match:title ^(Waypaper)$

# --------------------------------------------------------
# Common Dialog Windows
# --------------------------------------------------------
windowrule = float true, center true, size 700 500,match:title ^(Open.*Files?|Save.*Files?|All Files|Save)$
windowrule = float true, center true, size 700 500,match:title ^(Save).*$
# Rename dialogs
windowrule = float true, center true, size 350 100,match:title ^(Rename|Move).*$

# Generic dialog windows
windowrule = float true, center true,match:class ^(.*)[Dd]ialog(.*)$

# common modals
windowrule = float true,match:title ^(Confirm to replace files)$
windowrule = float true,match:title ^(File Operation Progress)$
windowrule = float true,match:class ^(xdg-desktop-portal-gtk)$
windowrule = float true,match:class ^(xdg-desktop-portal-hyprland)$
windowrule = float true, match:title ^(branchdialog)$
windowrule = float true, center true,size 622 652, match:class clipse
windowrule = persistent_size on,suppress_event maximize, match:class .*

# --------------------------------------------------------
# Workspace-Rules
# --------------------------------------------------------
windowrule = workspace 1,match:class ^(kitty)$
windowrule = workspace 2,match:class ^(zen|brave-browser|google-chrome)$
windowrule = workspace 3,match:class ^(cursor|neovide)$
windowrule = workspace 4,match:class ^(spotify|obsidian)$
windowrule = workspace 5,match:class ^(discord)$
windowrule = workspace 6,match:class ^(pcmanfm)$
