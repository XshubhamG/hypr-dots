$browser = brave
$lock = hyprlock
$terminal = footclient -e tmux new-session -A -s 'Home 󰣇'
$zen= zen-browser
$fileManager = pcmanfm
$notes = obsidian --ozone-platform=wayland
$wallpaper = waypaper
$code = cursor --ozone-platform=wayland
$spotify = spotify --ozone-platform=wayland
$random_wall = waypaper --random --folder ~/Pictures/walls --backend awww


# █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄
# █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀

$mainMod = SUPER # Sets "Windows" key as main modifier
bind = $mainMod, Q, killactive,

# █░█░█ █ █▄░█ █▀▄ █▀█ █░█░█   █▀▄▀█ ▄▀█ █▄░█ ▄▀█ █▀▀ █▀▄▀█ █▀▀ █▄░█ ▀█▀
# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █░▀░█ █▀█ █░▀█ █▀█ █▄█ █░▀░█ ██▄ █░▀█ ░█░

bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, $code
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen
bind = $mainMod, O, exec, $notes
bind = $mainMod, P, exec, foot -e btop
bind = $mainMod, R, exec, ~/.config/rofi/launchers/type-3/launcher.sh
bind = $mainMod, V, exec,  footclient -T clipse -e 'clipse'
bind = $mainMod, W, exec, $wallpaper
bind = $mainMod, Y, exec, foot -e yazi
bind = $mainMod, Z, exec, $zen
bind = $mainMod, Return, exec, $terminal

bind = ALT, M, exec, $spotify
# bind = ALT, Z, easymotion, action:hyprctl dispatch focuswindow address:{}

bind = $mainMod SHIFT, B, exec, pkill -x waybar || waybar &
bind = $mainMod SHIFT, W, exec, $random_wall
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod SHIFT, L, exec, $lock
bind = $mainMod SHIFT, M, exec, wlogout -b 5
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, Space, togglefloating

# Control scratchpad
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER CTRL, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# screenshot
bind =  ,Print, exec, hyprshot -m output -m eDP-1
bind = SUPER, Print, exec, hyprshot -m region --raw | satty --filename -
bind = SUPER SHIFT, Print, exec, hyprshot -m window

# █▀▀ █▀█ █▀▀ █░█ █▀
# █▀░ █▄█ █▄▄ █▄█ ▄█
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# █▀█ █▀▀ █▀ █ ▀█ █▀▀
# █▀▄ ██▄ ▄█ █ █▄ ██▄
bind = SUPER CTRL, h, resizeactive, -20 0
bind = SUPER CTRL, l, resizeactive, 20 0
bind = SUPER CTRL, k, resizeactive, 0 -20
bind = SUPER CTRL, j, resizeactive, 0 20

# █▀ █░█░█ █ ▀█▀ █▀▀ █░█
# ▄█ ▀▄▀▄▀ █ ░█░ █▄▄ █▀█
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# █▀▄▀█ █▀█ █░█ █▀▀
# █░▀░█ █▄█ ▀▄▀ ██▄
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# █▀▄▀█ █░█ █░░ ▀█▀ █ █▀▄▀█ █▀▀ █▀▄ █ ▄▀█
# █░▀░█ █▄█ █▄▄ ░█░ █ █░▀░█ ██▄ █▄▀ █ █▀█
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , xf86monbrightnessup, exec, brightnessctl set 5%+
binde = , xf86monbrightnessdown, exec, brightnessctl set 5%-

binds {
    drag_threshold = 10  # Fire a drag event only after dragging for more than 10px
}
bindm = ALT, mouse:272, movewindow      # ALT + LMB: Move a window by dragging more than 10px.
bindc = ALT, mouse:272, togglefloating  # ALT + LMB: Floats a window by clicking
binddm = ALT_CTRL, mouse:272, resizewindow
