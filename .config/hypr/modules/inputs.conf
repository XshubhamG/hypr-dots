input {
    kb_layout = us
    repeat_rate = 50
    repeat_delay = 300

    follow_mouse = 1

    sensitivity = 0.5 # -1.0 - 1.0, 0 means no modification.
    accel_profile = adaptive

touchpad {
        natural_scroll = true
        disable_while_typing = true
        drag_lock = 1
    }
}

cursor {
  hide_on_key_press = true
    warp_on_change_workspace = 1
}

gesture = 3, horizontal, workspace
