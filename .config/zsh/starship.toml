"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
${custom.git_host}\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$python\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "fg:mauve"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
Arch = "󰣇 "
Artix = "󰣇 "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[directory]
style = "fg:blue"
format = "[$path]($style) "
truncation_length = 2
truncation_symbol = "󱧶 "
home_symbol = "󱂵 "

[directory.substitutions]
"Documents" = "󱔘 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Desktop" = "󰇄 "
"Videos" = "󰈫 "
"code" = " "

[custom.git_host]
command = "git remote -v | grep -q 'github.com' && echo ' ' || echo ' ' "
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = "[$output]($style) "
style = "fg:teal"

[git_branch]
symbol = ""
style = "fg:teal"
format = '[$branch]($style) '

[git_status]
style = "fg:teal"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = " "
style = "fg:lavender"
format = '[$symbol( $version)]($style) '

[bun]
symbol = "󰏗 "
style = "fg:lavender"
format = '[$symbol( $version)]($style) '

[c]
symbol = " "
style = "fg:lavender"
format = '[$symbol( $version)]($style) '

[cpp]
symbol = " "
style = "fg:lavender"
format = '[$symbol( $version)]($style) '

[rust]
symbol = " "
style = "fg:lavender"
format = '[$symbol( $version)]($style) '

[golang]
symbol = " "
style = "fg:lavender"
format = '[$symbol( $version)]($style) '

[python]
symbol = " "
style = "fg:lavender"
format = '[$symbol( $version)(\(#$virtualenv\))]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:green)'

[docker_context]
symbol = " "
style = "fg:sapphire"
format = '[$symbol( $context)]($style) '

[cmd_duration]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
mauve = "#cba6f7"
pink = "#f5c2e7"
maroon = "#eba0ac"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
ce0 = "#313244"
