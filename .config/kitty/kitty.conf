# The basic colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Cursor colors
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# URL underline color when hovering with mouse
url_color               #f5e0dc

# Kitty window border colors
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #a6adc8

shell zsh --login -c "tmux a -t 'Home 󰣇' || tmux new -s 'Home 󰣇'"

# Editor
term                                xterm-256color
editor                              nvim
shell_integration                   enabled
kitty_mod                           ctrl+shift
enable_audio_bell no

# Window 
window_padding_width                0 5
window_title                        xshubhamg@void
scrollback_lines                    1000
wheel_scroll_multiplier             5.0

# Cursor and mouse  
cursor_shape                        block
cursor_block_thickness              0.9
cursor_beam_thickness               0.9
cursor_underline_thickness          2.0
cursor_blink_interval               0.5
cursor_stop_blinking_after          15.0
url_style                           single
url_prefixes                        http https file ftp irc mailto news git
detect_urls                         yes

# Fonts 
font_family                         JetBrainsMono Nerd Font Mono
adjust_line_height                  7
bold_font                           auto
italic_font                         auto
bold_italic_font                    auto
font_size                           15.0
font_weight                         normal
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Cursor trail 
cursor_trail 5
cursor_trail_start_threshold 0
shell_integration no-cursor
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 2
cursor_shape block
cursor_blink true
