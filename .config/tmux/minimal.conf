# Status Line - minimal and transparent
set -g status-left ""
set -g status-right "#[fg=#7f849c]#S "
set -g status-style "bg=default,fg=#cdd6f4"

# Window Status - text only, subtle colors
set -g window-status-format "#[fg=#6c7086] #I:#W"
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W"

# Pane Borders - dim borders, active one slightly brighter
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#45475a"

# Message Style
set -g message-style "fg=#cba6f7,bg=default"
set -g message-command-style "fg=#cba6f7,bg=default"
