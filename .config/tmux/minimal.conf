# Minimal colorscheme for Tmux
# TokyoNight Night palette
#
# background  #1a1b26  (bg)
# foreground  #c0caf5  (fg)
# muted       #565f89  (comment)
# border      #292e42  (bg_highlight)
# black       #15161e  (bg_dark)
# blue        #7aa2f7  (blue)
# cyan        #7dcfff  (cyan)

# Set vi style key bindings in copy mode
set-option -g mode-keys vi

# Status bar
set-option -g status-style "bg=#1a1b26,fg=#565f89"
set-option -g status-justify left

# Window list (left side)
set-window-option -g window-status-style "bg=#1a1b26,fg=#565f89"
set-window-option -g window-status-current-style "bg=green,fg=#15161e"
set-window-option -g window-status-separator " "

# Format window names
set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W "

# Panes
set-option -g pane-border-style "fg=#292e42"
set-option -g pane-active-border-style "fg=#565f89"

# Messages
set-option -g message-style "bg=#1a1b26,fg=#c0caf5"
set-option -g message-command-style "bg=#1a1b26,fg=#c0caf5"
set-option -g prompt-cursor-colour "#c0caf5"

# Copy mode
set-window-option -g copy-mode-match-style "bg=#292e42,fg=#c0caf5"
set-window-option -g copy-mode-current-match-style "bg=#7aa2f7,fg=#15161e"

# Status left — windows flow here naturally
set-option -g status-left ""
set-option -g status-left-length 0

# Status right — session name only
set-option -g status-right "#[fg=#565f89] #S "
set-option -g status-right-length 40
